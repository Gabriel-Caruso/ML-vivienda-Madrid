[project]
name = "tasador-madrid"
version = "0.1.0"
description = "Servicio web que estima el precio de venta de una vivienda en Madrid con un modelo CatBoost."
readme = "README.md"
authors = [
    { name = "Ramiro Caruso" },
    { name = "Ana Manzanares" },
]
requires-python = "==3.14.*"
dependencies = [
    # Versiones exactas del entrenamiento: el modelo serializado depende de ellas.
    "catboost==1.2.10",
    "scikit-learn==1.9.0",
    "pandas==3.0.3",
    "numpy==2.5.1",
    "joblib==1.5.3",
    # Capa web: cota inferior; la versión exacta la fija uv.lock.
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Dependencias indirectas fijadas a las versiones del entorno de entrenamiento.
# Solo restringen la versión: no instalan nada que no pida otra dependencia.
constraint-dependencies = [
    "contourpy==1.3.3",
    "fonttools==4.63.0",
    "kiwisolver==1.5.0",
    "matplotlib==3.11.0",
    "narwhals==2.23.0",
    "packaging==26.2",
    "plotly==6.9.0",
    "pyparsing==3.3.2",
    "scipy==1.18.0",
    "threadpoolctl==3.6.0",
    "tzdata==2026.2",
]

[tool.uv.build-backend]
module-name = "tasador"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (errores)
    "W",   # pycodestyle (avisos)
    "F",   # pyflakes
    "I",   # orden de imports
    "UP",  # sintaxis moderna de Python
    "B",   # bugbear: errores probables
    "SIM", # simplificaciones
    "PTH", # obliga a usar pathlib
    "T20", # prohíbe print fuera de los scripts
    "RUF", # reglas propias de Ruff
]
ignore = [
    "SIM110", # pide sustituir bucles for por any()/all(): el proyecto prefiere bucles explícitos
    "SIM300", # confunde constantes del dominio en mayúsculas con literales ("Yoda conditions")
]

[tool.ruff.lint.per-file-ignores]
# Los scripts de un solo uso informan por consola.
"scripts/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite testear las funciones puras de los scripts de un solo uso
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "error",
    # Starlette 1.7 recomienda httpx2 para el TestClient; la documentación de FastAPI
    # sigue pidiendo httpx. Se mantiene httpx (docs/DECISIONES.md, D-024).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
